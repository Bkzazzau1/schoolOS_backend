<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the SkulGen app</title>
<meta name="description" content="Get the SkulGen app for Android, iPhone, iPad and Windows.">
<link rel="icon" href="../assets/favicon.ico">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #082D5B; --teal: #00C896; --muted: #5A6B85; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Poppins", system-ui, sans-serif; color: #172B4D; background: #F5F7FA; padding: 1.5rem; }
  .card { max-width: 30rem; text-align: center; }
  img.icon { width: 88px; height: 88px; margin: 0 auto 1.5rem; }
  h1 { font-size: 1.6rem; color: var(--navy); margin: 0 0 .75rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  .button { display: inline-block; padding: .85rem 1.6rem; border-radius: .6rem; font-weight: 600;
    text-decoration: none; background: var(--teal); color: #fff; }
  a.back { display: block; margin-top: 1.2rem; color: var(--muted); font-size: .9rem; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="../assets/icon-512.png" alt="SkulGen">
    <h1>Get the SkulGen app</h1>
    <p>SkulGen runs on Android, iPhone, iPad and Windows. We're setting up each app's public listing now — reach out and we'll get your school connected directly.</p>
    <a class="button" href="mailto:hello@skulgen.com">hello@skulgen.com</a>
    <a class="back" href="https://skulgen.com">&larr; Back to skulgen.com</a>
  </div>
</body>
</html>
