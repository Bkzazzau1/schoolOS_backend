<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>{% block title %}SkulGen console{% endblock %}</title>
  <style>
    :root { --ink: #1d1b20; --muted: #5f5b66; --line: #e3e0e8; --brand: #4a2d73; --bg: #f6f5f8; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); margin: 0; }
    header { background: var(--brand); color: #fff; padding: .9rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    header .spacer { flex: 1; }
    header .who { color: #e4dbf1; font-size: .9rem; }
    main { max-width: 72rem; margin: 0 auto; padding: 1.5rem; }
    .card { background: #fff; border-radius: .75rem; padding: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 1.25rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); font-size: .92rem; }
    th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .02em; }
    tr:last-child td { border-bottom: none; }
    a.row-link { color: var(--ink); text-decoration: none; }
    a.row-link:hover { color: var(--brand); text-decoration: underline; }
    .stat-grid { display: flex; flex-wrap: wrap; gap: 1rem; }
    .stat { background: #fff; border-radius: .75rem; padding: 1rem 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); min-width: 8rem; }
    .stat .n { font-size: 1.6rem; font-weight: 700; }
    .stat .label { color: var(--muted); font-size: .85rem; }
    .pill { display: inline-block; padding: .15rem .55rem; border-radius: 999px; font-size: .78rem; font-weight: 600; }
    .tone-good { background: #e3f3e6; color: #1e6b31; }
    .tone-info { background: #e5eefb; color: #2456a6; }
    .tone-warn { background: #fdf2da; color: #8a5a00; }
    .tone-bad { background: #fdecea; color: #7a1c14; }
    .tone-muted { background: #eee; color: var(--muted); }
    .muted { color: var(--muted); }
    form.inline { display: inline; }
    select, input[type=text] { padding: .4rem .5rem; border: 1px solid #c9c5d0; border-radius: .4rem; font-size: .9rem; }
    button, .button { padding: .45rem .9rem; font-size: .9rem; background: var(--brand); color: #fff; border: 0;
      border-radius: .4rem; text-decoration: none; cursor: pointer; }
    .button.secondary { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
    .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
    .messages li { background: #e3f3e6; color: #1e6b31; padding: .6rem .9rem; border-radius: .5rem; margin-bottom: .5rem; }
    .action-row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-top: .5rem; }
  </style>
</head>
<body>
<header>
  <a href="{% url 'console:dashboard' %}">SkulGen console</a>
  <a href="{% url 'console:organizations' %}">Organizations</a>
  <span class="spacer"></span>
  {% if request.user.is_authenticated %}<span class="who">{{ request.user.email }}</span>{% endif %}
</header>
<main>
  {% if messages %}
    <ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
