# Appended to /etc/nginx/conf.d/skulgen.conf once the Let's Encrypt cert for
# skulgen.com (covering api./admin./app./www.skulgen.com) exists. Only
# api.skulgen.com and admin.skulgen.com proxy to the real backend;
# skulgen.com/www and app.skulgen.com serve the static site in
# /var/www/skulgen-site (see website/ in this repo) directly - nothing
# dynamic, no proxy_pass, no Django involved at all.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.skulgen.com;
    ssl_certificate /etc/letsencrypt/live/skulgen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skulgen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SKULGENSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Matches apps/media/constants.py's own ceiling (the largest category, video, is 200MB).
    client_max_body_size 220m;
    location ~ (^|/)\. { return 404; }
    location ^~ /media/ { return 404; }
    location /static/ {
        alias /opt/skulgen/backend/staticfiles/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.skulgen.com;
    ssl_certificate /etc/letsencrypt/live/skulgen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skulgen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SKULGENSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ (^|/)\. { return 404; }
    location /static/ {
        alias /opt/skulgen/backend/staticfiles/;
        expires 1h;
    }
    location = / { return 302 /admin/; }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skulgen.com www.skulgen.com;
    ssl_certificate /etc/letsencrypt/live/skulgen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skulgen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SKULGENSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/skulgen-site;
    index index.html;
    location ~ (^|/)\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.skulgen.com;
    ssl_certificate /etc/letsencrypt/live/skulgen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skulgen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SKULGENSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/skulgen-site/app;
    index index.html;
    location ~ (^|/)\. { return 404; }
    location / { try_files $uri $uri/ =404; }
    location /assets/ { alias /var/www/skulgen-site/assets/; }
}
